<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fc-bg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Inner Highlight Border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="1.2" />

  <!-- FC Monogram -->
  <text
    x="31"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="-1.5"
    text-anchor="middle"
    fill="#ffffff"
  >F<tspan fill="url(#fc-accent)">C</tspan></text>

  <!-- Modern Emerald Accent Dot -->
  <circle cx="50" cy="17" r="3" fill="#34d399" />
</svg>