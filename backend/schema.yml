components:
  schemas:
    ActionEnum:
      enum:
      - show
      - hide
      - require
      type: string
      description: |-
        * `show` - Show
        * `hide` - Hide
        * `require` - Require
    ConditionalRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        form_version:
          type: integer
          readOnly: true
        trigger_field:
          type: integer
          nullable: true
        operator:
          $ref: '#/components/schemas/OperatorEnum'
        comparison_value:
          nullable: true
        target_field:
          type: integer
          nullable: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - form_version
      - id
    Field:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        placeholder:
          type: string
          nullable: true
          maxLength: 255
        help_text:
          type: string
          nullable: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        config: {}
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOption'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - field_type
      - id
      - label
      - updated_at
    FieldOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 255
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - label
      - value
    FieldTypeEnum:
      enum:
      - text
      - number
      - email
      - dropdown
      - checkbox
      - date
      - file
      - rating
      type: string
      description: |-
        * `text` - Text
        * `number` - Number
        * `email` - Email
        * `dropdown` - Dropdown
        * `checkbox` - Checkbox
        * `date` - Date
        * `file` - File
        * `rating` - Rating
    Form:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        owner:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - status
      - title
      - updated_at
    OperatorEnum:
      enum:
      - equals
      - not_equals
      - contains
      - greater_than
      - is_empty
      type: string
      description: |-
        * `equals` - Equals
        * `not_equals` - Not Equals
        * `contains` - Contains
        * `greater_than` - Greater Than
        * `is_empty` - Is Empty
    PatchedConditionalRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        form_version:
          type: integer
          readOnly: true
        trigger_field:
          type: integer
          nullable: true
        operator:
          $ref: '#/components/schemas/OperatorEnum'
        comparison_value:
          nullable: true
        target_field:
          type: integer
          nullable: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedField:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        placeholder:
          type: string
          nullable: true
          maxLength: 255
        help_text:
          type: string
          nullable: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        config: {}
        options:
          type: array
          items:
            $ref: '#/components/schemas/FieldOption'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedForm:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        owner:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ResponseInput:
