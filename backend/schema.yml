        '200':
          description: Form published successfully.
  /api/forms/share/{share_token}/:
    get:
      operationId: forms_share_retrieve
      parameters:
      - in: path
        name: share_token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - forms
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/forms/share/{share_token}/submit/:
    post:
      operationId: forms_share_submit_create
      description: Submit JSON responses as application/json, or submit multipart/form-data
        with `responses` as a JSON array string and files named `file_<field_id>`.
        File fields omitted from the multipart body are treated as unanswered.
      parameters:
      - in: path
        name: share_token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - forms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
          multipart/form-data:
            schema:
              type: object
              required:
              - responses
              properties:
                responses:
                  type: string
                  description: 'A JSON array, for example [{"field": 159, "value":
                    "yes"}].'
                file_<field_id>:
                  type: string
                  format: binary
                  description: Replace <field_id> with the ID of a file field, for
                    example file_162.
            examples:
              MultipartResponsesValue:
                value: '[{"field": 159, "value": "yes"}, {"field": 160, "value": "ABCDE"},
                  {"field": 161, "value": "person@example.com"}]'
                summary: Multipart responses value
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Form submitted successfully.
  /api/login/:
    post:
      operationId: login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
